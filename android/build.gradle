buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url "$rootDir/../node_modules/@notifee/react-native/android/libs"
        }
    }
    // Force consistent Google Play Services version across all dependencies
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-location:21.3.0'
            force 'com.google.android.gms:play-services-base:18.5.0'
            force 'com.google.android.gms:play-services-basement:18.4.0'
        }
    }
}
